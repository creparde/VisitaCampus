<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionGuide VR - Anhanguera Antônio Carlos</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>
  <div id="startScreen">
    <h1>VisionGuide VR</h1>
    <h2>Anhanguera Antônio Carlos</h2>
    <p>Experiência inclusiva em realidade virtual 360°</p>
    <p class="dica">
      Toque em iniciar para conhecer o campus.
      Utilize os controles para navegar.
      No celular, toque no ícone de óculos para entrar no modo VR.
    </p>
    <button id="startButton">INICIAR EXPERIÊNCIA</button>
  </div>

  <a-scene
    vr-mode-ui="enabled: true"
    loading-screen="dotsColor: #FF6600; backgroundColor: #13294B"
    renderer="colorManagement: true"
    background="color: #000">

    <a-assets timeout="30000">
      <!-- As fotos são reduzidas somente em memória pelo Main.js. -->
      <canvas id="panoramaCanvas" width="2048" height="1024"></canvas>
    </a-assets>

    <a-sky id="ceu" src="#imgBoasVindas" rotation="0 -90 0"></a-sky>

    <a-entity id="painel" position="0 2.3 -3">
      <a-plane width="3.2" height="1.15" color="#13294B" material="shader: flat; transparent: true; opacity: 0.9"></a-plane>
      <a-text id="titulo" value="Bem-vindo" align="center" color="#FF6600" width="4.5" position="0 0.3 0.02"></a-text>
      <a-text id="descricao" value="Campus Virtual" align="center" color="#FFFFFF" width="3.4" wrap-count="36" position="0 -0.02 0.02"></a-text>
      <a-text id="progresso" value="Cena 1 de 8" align="center" color="#DDDDDD" width="2.5" position="0 -0.4 0.02"></a-text>
    </a-entity>

    <a-entity position="0 0.9 -2.5" rotation="-15 0 0">
      <a-plane class="clicavel" id="btnAnterior" width="0.9" height="0.38" color="#444444" position="-1 0 0">
        <a-text value="ANTERIOR" align="center" width="2.5" position="0 0 0.02"></a-text>
      </a-plane>
      <a-plane class="clicavel" id="btnRepetir" width="0.9" height="0.38" color="#444444" position="0 0 0">
        <a-text value="REPETIR" align="center" width="2.5" position="0 0 0.02"></a-text>
      </a-plane>
      <a-plane class="clicavel" id="btnProximo" width="0.9" height="0.38" color="#FF6600" position="1 0 0">
        <a-text value="PRÓXIMO" align="center" width="2.5" position="0 0 0.02"></a-text>
      </a-plane>
    </a-entity>

    <a-entity id="cameraRig" camera look-controls="magicWindowTrackingEnabled: true" position="0 1.6 0">
      <a-cursor
        fuse="true"
        fuse-timeout="2000"
        raycaster="objects: .clicavel"
        color="#FF6600"
        animation__fusing="property: scale; startEvents: fusing; from: 1 1 1; to: 0.3 0.3 0.3; dur: 2000"
        animation__reset="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 200">
      </a-cursor>
    </a-entity>
  </a-scene>

  <div id="vrControls">
    <button id="toggleVR">ENTRAR NO MODO VR</button>
  </div>

  <div id="stereoOverlay">
    <canvas id="leftEye"></canvas>
    <canvas id="rightEye"></canvas>
    <button id="exitVR">SAIR DO MODO VR</button>
  </div>

  <script src="./main.js"></script>
</body>
</html>
